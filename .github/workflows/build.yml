name: mcpm Executable file Build
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm i
      - name: Build
        run: npm run compile
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: [dist/build/generated/*, CHANGELOG.md]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}