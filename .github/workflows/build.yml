name: mcpm Executable file Build
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm i

      - name: Bundle
        run: npm run bundle

      - name: Build Executable
        run: npm run compile

#      - name: Compile to Windows Installer
#        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
#        with:
#          path: setup.iss

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            build/generated/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}